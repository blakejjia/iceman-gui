name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore iceman-gui.csproj

      - name: Build Application
        run: dotnet build iceman-gui.csproj -c Release --no-restore

      - name: Publish Binaries (win-x64, Self-Contained)
        run: |
          dotnet publish iceman-gui.csproj -c Release -r win-x64 --self-contained true -o publish/

      - name: Verify Bundled Client & Dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\client\proxmark3.exe")) {
            throw "CRITICAL ERROR: publish\client\proxmark3.exe is missing from release output!"
          }
          if (-not (Test-Path "publish\client\libs\Qt6Core.dll")) {
            throw "CRITICAL ERROR: publish\client\libs\Qt6Core.dll is missing from release output!"
          }
          if (-not (Test-Path "publish\iceman-gui.exe")) {
            throw "CRITICAL ERROR: publish\iceman-gui.exe is missing from release output!"
          }
          Write-Host "Verification PASSED: Bundled Proxmark3 client and self-contained runtime are intact."

      - name: Copy Documentation & License to Release
        shell: pwsh
        run: |
          Copy-Item -Path "README.md", "LICENSE" -Destination "publish\" -ErrorAction SilentlyContinue

      - name: Package Release Zip & Checksums
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\*" -DestinationPath "iceman-gui-windows-x64.zip" -Force
          $hash = (Get-FileHash -Path "iceman-gui-windows-x64.zip" -Algorithm SHA256).Hash
          "$hash  iceman-gui-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          $size = (Get-Item "iceman-gui-windows-x64.zip").Length / 1MB
          Write-Host "Archive created: iceman-gui-windows-x64.zip ($([math]::Round($size, 2)) MB)"
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            iceman-gui-windows-x64.zip
            SHA256SUMS.txt
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
